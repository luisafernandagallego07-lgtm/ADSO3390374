<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>42-Parallax</title>
    <link rel="stylesheet" href="../src/css/master.css" />
    <style>
      section {
        div.parallax {
          outline: 2px solid #fff;
          border-radius: 12px;
          corner-shape: squircle;
          overflow: hidden;
          position: relative;
          height: 576px;

          div.layer8,
          div.layer7,
          div.layer6,
          div.layer5,
          div.layer4,
          div.layer3,
          div.layer2,
          div.layer1 {
            position: absolute;
            height: 576px;
            top: 0;
            left: 0;
            width: 1024px;
          }

          & .layer8 {
            background: url(imgs/layer_08.png) no-repeat;
          }

          & .layer7 {
            background: url(imgs/layer_07.png) repeat-x;
            animation: 40s animLayer linear infinite;
          }

          & .layer6 {
            background: url(imgs/layer_06.png) repeat-x;
            animation: 35s animLayer linear infinite;
          }

          & .layer5 {
            background: url(imgs/layer_05.png) repeat-x;
            animation: 30s animLayer linear infinite;
          }

          & .layer4 {
            background: url(imgs/layer_04.png) repeat-x;
            animation: 25s animLayer linear infinite;
          }
          & .layer3 {
            background: url(imgs/layer_03.png) repeat-x;
            animation: 20s animLayer linear infinite;
          }

          & .layer2 {
            background: url(imgs/layer_02.png) repeat-x;
            animation: 10s animLayer linear infinite;
          }

          & .layer1 {
            background: url(imgs/layer_01.png) repeat-x;
            animation: 2.5s animLayer linear infinite;
          }

          & .runner {
            position: absolute;
            background: url(imgs/running.gif) no-repeat center / cover;
            height: 200px;
            transform: scale(0.5);
            bottom: 60px;
            left: 60px;
            width: 200px;
          }
        }
      }

      @media (min-width: 1024px) {
        body {
          main {
            width: 1024px;
            section {
              div.parallax {
                div.runner {
                  left: 380px;
                }
              }
            }
          }
        }
      }

      @keyframes animLayer {
        100% {
          background-position-x: -1024px;
        }
      }
    </style>
  </head>
  <body class="css">
    <a href="index.html" class="btn-home">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        fill="#000000"
        viewBox="0 0 256 256"
      >
        <path
          d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm48-88a8,8,0,0,1-8,8H107.31l18.35,18.34a8,8,0,0,1-11.32,11.32l-32-32a8,8,0,0,1,0-11.32l32-32a8,8,0,0,1,11.32,11.32L107.31,120H168A8,8,0,0,1,176,128Z"
        ></path>
      </svg>
    </a>
    <main>
      <header class="mainmenu">
        <h1>42 - Parallax</h1>
        <h3>Move at a different speed the backgrounds.</h3>
      </header>
      <section>
        <div class="parallax">
          <div class="layer8"></div>
          <div class="layer7"></div>
          <div class="layer6"></div>
          <div class="layer5"></div>
          <div class="layer4"></div>
          <div class="layer3"></div>
          <div class="layer2"></div>
          <div class="layer1"></div>
          <div class="runner"></div>
        </div>
      </section>
    </main>
  </body>
</html>
