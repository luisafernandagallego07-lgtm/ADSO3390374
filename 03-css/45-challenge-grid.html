    <style>
    .galeria {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-auto-rows: 80px; 
  grid-auto-flow: dense;
}
.foto img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.f1, .f2, .f3, .f4, .f5, .f6, .f7, .f8, .f9 {
  grid-column: span 2;
}

.f10, .f11 {
  grid-column: span 3;
}

.f1 { grid-row: span 3; }
.f2 { grid-row: span 2; }
.f3 { grid-row: span 3; }
.f4 { grid-row: span 3; }
.f5 { grid-row: span 4; }
.f6 { grid-row: span 3; }
.f7 { grid-row: span 2; }
.f8 { grid-row: span 3; }
.f9 { grid-row: span 2; }
.f10 { grid-row: span 4; }
.f11 { grid-row: span 4; }
</style>
</head>
